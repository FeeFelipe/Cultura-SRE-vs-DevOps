name: CI - Reliability Lab (Python)

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

jobs:
  test-and-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        working-directory: health
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: health
        run: pytest -q

      - name: Build Docker image
        working-directory: health
        run: |
          docker build -t reliability-lab-py:ci .

      - name: Start app (background, Docker)
        run: |
          docker run --rm -d -p 8080:8080 --name reliability-lab-py reliability-lab-py:ci
          sleep 2

      - name: Health-check (status)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          echo "HTTP $code"
          test "$code" = "200"

      - name: Health-check (latency SLO 200ms)
        run: |
          t=$(curl -s -w "%{time_total}" -o /dev/null http://localhost:8080/health)
          echo "latency: ${t}s"
          # bloqueia se > 0.2s (200ms)
          if (( $(echo "$t > 0.2" | bc -l) )); then exit 1; fi

      - name: Simulate failure (HEALTH_FAIL=true → deve falhar)
        run: |
          docker stop reliability-lab-py || true
          docker run --rm -d -p 8080:8080 --name reliability-lab-py -e HEALTH_FAIL=true reliability-lab-py:ci
          sleep 2
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          echo "HTTP $code (esperado 500)"
          test "$code" = "500"

      - name: Stop app (Docker)
        if: always()
        run: docker stop reliability-lab-py || true
