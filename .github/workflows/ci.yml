name: CI - Reliability Lab (Python)

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

jobs:
  test-and-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start (Docker Compose)
        run: |
          docker compose up --build -d
          sleep 2

      - name: Show HEALTH_FAIL value (Docker Compose)
        run: |
          echo "HEALTH_FAIL in container: $(docker compose exec reliability-lab printenv HEALTH_FAIL)"

      - name: Health-check (status)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          echo "HTTP $code"
          test "$code" = "200"

      - name: Health-check (latency SLO 200ms)
        run: |
          t=$(curl -s -w "%{time_total}" -o /dev/null http://localhost:8080/health)
          echo "latency: ${t}s"
          # bloqueia se > 0.2s (200ms)
          if (( $(echo "$t > 0.2" | bc -l) )); then exit 1; fi

      - name: Simulate failure (HEALTH_FAIL=true → deve falhar)
        run: |
          docker compose down
          HEALTH_FAIL=true docker compose up --build -d
          sleep 2
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          echo "HTTP $code (esperado 500)"
          test "$code" = "500"

      - name: Stop app (Docker Compose)
        if: always()
        run: docker compose down || true
